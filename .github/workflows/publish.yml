name: Publish Electron App

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um release por vez: dois pushes seguidos não geram a mesma versão duas vezes.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    # O commit de versão é enviado com GITHUB_TOKEN e não dispara o workflow de novo.
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Conventional commits desde a última tag: feat -> minor, "!"/BREAKING CHANGE -> major, resto -> patch.
      - name: Bump version
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          LOG=$(git log ${LAST_TAG:+$LAST_TAG..}HEAD --format=%B)

          if echo "$LOG" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            BUMP=major
          elif echo "$LOG" | grep -qE '^feat(\(.+\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG=$(npm version "$BUMP" -m "chore(release): %s [skip ci]")
          git push --follow-tags origin HEAD:main

          echo "Versão: $LAST_TAG -> $TAG ($BUMP)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

      - name: Verify DMG (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          echo "🔍 Searching for DMG files..."
          find out/make -name "*.dmg"

          echo "✅ Verifying DMG..."
          for dmg in $(find out/make -name "*.dmg"); do
            echo "Verifying $dmg"
            hdiutil verify "$dmg"

            echo "🔒 Mounting DMG..."
            MOUNT_OUTPUT=$(hdiutil attach "$dmg" -nobrowse -readonly)
            MOUNT_DIR=$(echo "$MOUNT_OUTPUT" | grep -o '/Volumes/[^ ]*')
            echo "Mounted at $MOUNT_DIR"

            APP_PATH=$(find "$MOUNT_DIR" -name "*.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "❌ No .app bundle found in DMG"
              exit 1
            fi
            echo "Found app: $APP_PATH"

            EXECUTABLE=$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleExecutable)
            EXEC_PATH="$APP_PATH/Contents/MacOS/$EXECUTABLE"

            echo "🧪 Checking if executable exists and is valid..."
            if [ ! -x "$EXEC_PATH" ]; then
              echo "❌ Executable is missing or not executable: $EXEC_PATH"
              exit 1
            fi

            echo "📦 Executable file info:"
            file "$EXEC_PATH"

            echo "🔐 Checking code signature (if any)..."
            codesign --verify --deep --strict --verbose=2 "$APP_PATH" || echo "⚠️ Not signed or signature is invalid"

            echo "✅ All checks passed!"

            echo "📤 Unmounting..."
            hdiutil detach "$MOUNT_DIR"
          done
